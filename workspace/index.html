<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-fundo-branco.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cidev é uma software house brasileira que projeta, constrói e escala produtos digitais — do MVP ao lançamento."
    />
    <title>Cidev — Software house de raiz</title>
    <script>
      ;(function () {
        try {
          var key = 'cidev-theme'
          var stored = localStorage.getItem(key)
          var theme = stored === 'light' || stored === 'dark' ? stored : 'light'
          var root = document.documentElement
          if (theme === 'dark') root.classList.add('dark')
          root.setAttribute('data-theme', theme)
          root.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
